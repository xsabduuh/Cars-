<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>حجز سيارة | EliteDrive</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/booking.css"></head>
<body>
  <nav class="navbar">...</nav>
  <div class="container booking-wrapper">
    <h2><i class="fas fa-file-invoice"></i> إتمام الحجز</h2>
    <form id="bookingForm">
      <div class="form-row"><div class="form-group"><label>الاسم الكامل</label><input type="text" id="fullName" required placeholder="أحمد محمد"></div><div class="form-group"><label>رقم الهاتف</label><input type="tel" id="phone" required placeholder="+212 6XX XXX XXX"></div></div>
      <div class="form-group"><label>السيارة المختارة</label><select id="carSelect" required></select></div>
      <div class="form-row"><div class="form-group"><label>تاريخ البداية</label><input type="date" id="bookStartDate" required></div><div class="form-group"><label>تاريخ النهاية</label><input type="date" id="bookEndDate" required></div></div>
      <div class="total-price" id="totalPriceDisplay">المبلغ الإجمالي: 0 $</div>
      <button type="submit" class="btn-primary btn-block">تأكيد الحجز <i class="fas fa-check-circle"></i></button>
    </form>
  </div>
  <footer class="footer">...</footer>
  <script src="js/data.js"></script>
  <script src="js/global.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
